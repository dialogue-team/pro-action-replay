# serverブロック内に置く。静的ファイルをnginxから直接返し、期限を付ける
location ~ ^/(favicon\.ico|css/|js/|img/|assets/) {
  root /home/isucon/app/public;
  expires 1d;
  add_header Cache-Control "public";
  access_log off;
}

